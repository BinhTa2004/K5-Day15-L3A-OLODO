# Mô phỏng chi phí khi dùng thật — Track D3 Trả hàng / Hoàn tiền trung lập (OLODO · L3A).
# Toàn bộ tỷ lệ và tần suất bám theo evidence/survey/results.csv (n=32) và evidence/data-mining.md (127.546 dòng).

sessions: 50
seed: 42

users:
  low: 15000
  base: 50000
  high: 200000
  source: "https://dataset.xomdata.com/datasets/schema/vietnam_ecommerce (xem 27/11/2026) — 10 shop Shopee trong vietnam_ecommerce đã có 14.513 người mua duy nhất (evidence/data-mining.md); low=15.000 (~10 shop), base=50.000 (~35 shop, tự ước tính), high=200.000 (~140 shop, tự ước tính)"

personas:
  - name: mua_it
    share: 0.59
    uses_per_month: 0.15
    turns_per_session: 1
    types: [thuong]
    source: "evidence/survey/results.csv (n=32, Q2: 19/32 = 59,4% đặt <3 đơn/tháng; Q4: nhóm ít gặp sự cố ~0,15 phiên/tháng; 1 lượt/phiên tự ước tính)"
  - name: mua_thuong_xuyen
    share: 0.35
    uses_per_month: 0.54
    turns_per_session: 2
    types: [thuong, kho]
    source: "evidence/survey/results.csv (n=32, Q2: 12/32 = 37,5% đặt 3-10 đơn/tháng; Q4: nhóm từng gặp sự cố TB 0,54 lần/tháng; 2 lượt/phiên hỏi + bổ sung bằng chứng tự ước tính)"
  - name: hoan_lap_lai
    share: 0.06
    uses_per_month: 1.8
    turns_per_session: 3
    types: [kho, tu_choi]
    source: "evidence/data-mining.md (vietnam_ecommerce: 262/14.513 = 1,81% khách Shopee hoàn >=2 lần tạo 45,63% ca hoàn, tối đa 9 lần) + evidence/survey/results.csv (Q4: 21,9% gặp >=2 lần/3 tháng); 3 lượt tranh chấp/phiên tự ước tính"

prices:
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://developers.openai.com/api/docs/pricing · xem 25/11/2026 (bảng giá chuẩn K5 further-reading/model-prices.md)"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (bảng giá chuẩn K5 further-reading/model-prices.md)"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (bảng giá chuẩn K5 further-reading/model-prices.md)"

usd_to_vnd:
  rate: 25400
  source: "Tỷ giá tham chiếu 25.400 VND/USD (tự ước tính tham chiếu ngày 28/11/2026)"
